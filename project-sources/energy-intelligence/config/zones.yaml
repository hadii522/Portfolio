# European Bidding Zone Configuration
# Add any ENTSO-E EIC code here to extend the platform to new markets.
# EIC codes reference: https://www.entsoe.eu/data/energy-identification-codes-eic/

zones:
  - eic: "10Y1001A1001A82H"
    name: "Germany-Luxembourg"
    short_name: "DE-LU"
    country_codes: ["DE", "LU"]
    timezone: "Europe/Berlin"
    enabled: true
    color: "#4F81BD"

  - eic: "10YFR-RTE------C"
