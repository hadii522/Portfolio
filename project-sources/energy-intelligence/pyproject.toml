[tool.ruff]
line-length = 110
target-version = "py312"
include = ["backend/app/**/*.py", "backend/tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["backend/tests/unit", "backend/tests/integration"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = ["integration: real PostgreSQL; requires ETIP_TEST_DATABASE_URL"]
