[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etip"
version = "1.0.0"
description = "Local energy intelligence with real data and reproducible forecasts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.38,<1", "sqlalchemy>=2.0.44,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic-settings>=2.12,<3",
  "pandas>=2.2,<3", "numpy>=2.1,<3", "scikit-learn>=1.7,<2",
  "joblib>=1.5,<2", "python-dotenv>=1.1,<2", "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
