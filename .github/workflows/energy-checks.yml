name: Energy application checks
on:
  push:
    branches: [main]
    paths: ["project-sources/energy-intelligence/**", ".github/workflows/energy-checks.yml"]
  pull_request:
    paths: ["project-sources/energy-intelligence/**", ".github/workflows/energy-checks.yml"]
  workflow_dispatch:

jobs:
  backend:
    defaults:
      run:
        working-directory: project-sources/energy-intelligence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: etip
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: etip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ETIP_DATABASE_URL: postgresql+psycopg://etip:ci-only-password@127.0.0.1:5432/etip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-sources/energy-intelligence/backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - run: pip install --no-deps -e ./backend
      - run: ruff check backend/app backend/tests
      - run: ruff format --check backend/app backend/tests
      - run: pytest backend/tests/unit backend/tests/integration
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-sources/energy-intelligence/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: project-sources/energy-intelligence/frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
